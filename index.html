<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Đồng hồ điện tử</title>
<style>
body{font-family:Arial;background:linear-gradient(135deg,#0f172a,#1d4ed8);display:grid;place-items:center;min-height:100vh;margin:0;color:white}
main{text-align:center;padding:35px;background:#ffffff18;border:1px solid #ffffff35;border-radius:20px;width:min(440px,85vw)}
h1{font-size:25px}.clock{font-size:clamp(42px,10vw,64px);font-weight:bold;letter-spacing:3px;margin:25px 0}
#date{font-size:18px}
</style></head><body><main><h1>ĐỒNG HỒ ĐIỆN TỬ</h1><div class="clock" id="clock">00:00:00</div><div id="date"></div></main>
<script>
const days=['Chủ nhật','Thứ hai','Thứ ba','Thứ tư','Thứ năm','Thứ sáu','Thứ bảy'];
function updateClock(){
 const now=new Date();
 const time=[now.getHours(),now.getMinutes(),now.getSeconds()].map(n=>String(n).padStart(2,'0')).join(':');
 document.getElementById('clock').textContent=time;
 document.getElementById('date').textContent=days[now.getDay()]+', '+now.toLocaleDateString('vi-VN');
}
updateClock();setInterval(updateClock,1000);
</script></body></html>
